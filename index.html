<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Imports · Simulador de Taxas</title>
<style>
  :root{
    --bg: #0a0e17;
    --card: #10141f;
    --card-2: #191f2e;
    --border: #262e42;
    --text: #f3f4f7;
    --muted: #8a90a3;
    --accent: #C81E2E;
    --accent-2: #14213f;
    --good: #3ddc84;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #151c2e 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 40px 16px;
  }
  .wrap{ width: 100%; max-width: 420px; }
  .brand{
    text-align:center;
    margin-bottom: 20px;
  }
  .brand img{
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 8px 24px rgba(200,30,46,0.25);
  }
  .brand-title{
    font-size: 20px;
    font-weight: 800;
    margin-top: 10px;
    letter-spacing: 0.5px;
  }
  .brand-title span{ color: var(--accent); }
  .brand-sub{
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 24px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }
  .label{
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    text-align:center;
    display:block;
    margin-bottom: 8px;
  }
  .value-row{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .valor-input{
    background:transparent;
    border:none;
    color: var(--text);
    font-size: 50px;
    font-weight: 700;
    width: 100%;
    text-align:center;
    outline:none;
  }
  .valor-input::-webkit-outer-spin-button,
  .valor-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .unit{
    text-align:center;
    color: var(--muted);
    font-size: 14px;
    margin-top: -6px;
    margin-bottom: 22px;
  }
  .field{ margin-bottom: 18px; }
  .field-label{
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 8px;
    display:block;
  }
  .row-2{ display:flex; gap: 10px; }
  select{
    appearance:none;
    -webkit-appearance:none;
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    padding: 14px 16px;
    border-radius: 14px;
    width: 100%;
    outline:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238a90a3' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position: right 14px center;
  }
  .toggle-row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 16px;
    padding: 18px 0 10px;
    border-top: 1px solid var(--border);
    margin-top: 6px;
  }
  .toggle-title{ font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .toggle-desc{ font-size: 13px; color: var(--muted); line-height:1.4; }
  .switch{
    position:relative;
    width: 46px;
    height: 26px;
    flex-shrink:0;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor:pointer;
    transition: background 0.2s;
  }
  .switch.on{ background: var(--accent); }
  .switch .knob{
    position:absolute;
    top: 2px; left: 2px;
    width: 20px; height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .switch.on .knob{ transform: translateX(20px); }
  .divider{ border-top: 1px solid var(--border); margin: 20px 0; }
  .result{ text-align:center; margin-bottom: 18px; }
  .result-value{
    font-size: 38px;
    font-weight: 700;
    color: var(--good);
  }
  .breakdown{
    background: var(--card-2);
    border-radius: 14px;
    padding: 14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size: 14px;
    margin-bottom: 10px;
  }
  .breakdown .l{ color: var(--muted); }
  .breakdown .v{ font-weight: 600; }
  .rate-pill{
    text-align:center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .rate-pill b{ color: var(--text); }
  .share-btn{
    width: 100%;
    margin-top: 16px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 15px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s, transform 0.1s;
  }
  .share-btn:active{ transform: scale(0.98); }
  .share-btn.copied{ background: var(--good); }
  .share-btn svg{ width: 18px; height: 18px; flex-shrink:0; }
  footer{
    text-align:center;
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>

<script>
const RATES = {"visa": {"name": "Visa", "debit": {"1": 2.4}, "credit": {"1": 4.63, "2": 6.04, "3": 6.65, "4": 7.25, "5": 7.95, "6": 8.65, "7": 9.4, "8": 10.15, "9": 10.75, "10": 11.25, "11": 12.15, "12": 12.65, "13": 14.15, "14": 14.86, "15": 15.57, "16": 16.28, "17": 16.99, "18": 17.7, "19": 18.7, "20": 19.4, "21": 20.0}}, "master": {"name": "Mastercard", "debit": {"1": 2.4}, "credit": {"1": 4.63, "2": 6.04, "3": 6.65, "4": 7.25, "5": 7.95, "6": 8.65, "7": 9.4, "8": 10.15, "9": 10.75, "10": 11.25, "11": 12.15, "12": 12.65, "13": 14.15, "14": 14.86, "15": 15.57, "16": 16.28, "17": 16.99, "18": 17.7, "19": 18.7, "20": 19.4, "21": 20.0}}, "hipercard": {"name": "HiperCard", "debit": {}, "credit": {"1": 4.72, "2": 6.62, "3": 7.33, "4": 8.33, "5": 8.74, "6": 9.35, "7": 10.34, "8": 11.04, "9": 11.75, "10": 12.75, "11": 13.16, "12": 13.86, "13": 14.57, "14": 15.27, "15": 15.97, "16": 16.68, "17": 17.38, "18": 18.09, "19": 18.79, "20": 19.49, "21": 20.19}}, "elo": {"name": "Elo", "debit": {"1": 3.05}, "credit": {"1": 5.1, "2": 6.92, "3": 7.54, "4": 8.1, "5": 8.8, "6": 9.5, "7": 10.25, "8": 11.0, "9": 11.75, "10": 12.5, "11": 13.0, "12": 13.75, "13": 14.87, "14": 15.57, "15": 16.27, "16": 16.98, "17": 17.68, "18": 18.39, "19": 19.09, "20": 19.4, "21": 20.1}}, "amex": {"name": "Amex", "debit": {}, "credit": {"1": 5.75, "2": 7.12, "3": 7.82, "4": 8.53, "5": 9.23, "6": 9.93, "7": 10.83, "8": 11.53, "9": 12.23, "10": 12.94, "11": 13.64, "12": 14.34, "13": 15.04, "14": 15.75, "15": 15.45, "16": 17.15, "17": 17.86, "18": 18.56, "19": 19.25, "20": 19.95, "21": 20.65}}, "cabal": {"name": "Cabal", "debit": {"1": 6.75}, "credit": {"1": 8.38, "2": 9.02, "3": 9.73, "4": 10.44, "5": 11.15, "6": 11.85, "7": 12.89, "8": 13.59, "9": 14.3, "10": 15.0, "11": 15.71, "12": 16.41, "13": 17.12, "14": 17.82, "15": 18.53, "16": 19.23, "17": 19.94, "18": 20.64}}, "pix": {"name": "Pix", "debit": {"1": 1.75}, "credit": {}}, "boleto": {"name": "Boleto", "debit": {"1": 1.75}, "credit": {}}};

const bandeiraSel = document.getElementById('bandeira');
const tipoSel = document.getElementById('tipo');
const parcelasSel = document.getElementById('parcelas');
const valorInput = document.getElementById('valor');
const toggle = document.getElementById('toggle');

let repassar = false;

Object.entries(RATES).forEach(([key, data]) => {
  if (key === 'master') return; // combinado com visa
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = key === 'visa' ? 'Visa / Master' : data.name;
  bandeiraSel.appendChild(opt);
});

function tiposDisponiveis(bandeiraKey){
  const data = RATES[bandeiraKey];
  const tipos = [];
  if (Object.keys(data.debit).length) tipos.push('debit');
  if (Object.keys(data.credit).length) tipos.push('credit');
  return tipos;
}

function popularTipos(){
  const bandeiraKey = bandeiraSel.value;
  const tipos = tiposDisponiveis(bandeiraKey);
  tipoSel.innerHTML = '';
  tipos.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t === 'debit' ? 'Débito' : 'Crédito';
    tipoSel.appendChild(opt);
  });
  popularParcelas();
}

function popularParcelas(){
  const bandeiraKey = bandeiraSel.value;
  const tipo = tipoSel.value;
  const data = RATES[bandeiraKey][tipo] || {};
  const parcelasDisponiveis = Object.keys(data).map(Number).sort((a,b)=>a-b);
  parcelasSel.innerHTML = '';
  parcelasDisponiveis.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p === 1 ? '1x (à vista)' : p + 'x';
    parcelasSel.appendChild(opt);
  });
  calcular();
}

function formatBRL(v){
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}

function calcular(){
  const bandeiraKey = bandeiraSel.value;
  const tipo = tipoSel.value;
  const parcelas = Number(parcelasSel.value);
  const valor = Number(valorInput.value) || 0;

  const taxaTable = RATES[bandeiraKey][tipo] || {};
  const taxa = taxaTable[parcelas];

  if (taxa === undefined) {
    document.getElementById('resultado').textContent = '—';
    document.getElementById('totalCobrar').textContent = '—';
    document.getElementById('taxaAplicada').textContent = '—';
    return;
  }

  let recebe, totalCobrar;

  if (!repassar) {
    recebe = valor * (1 - taxa/100);
    totalCobrar = valor;
  } else {
    recebe = valor;
    totalCobrar = valor / (1 - taxa/100);
  }

  document.getElementById('resultado').textContent = formatBRL(recebe);
  document.getElementById('totalCobrar').textContent = formatBRL(totalCobrar);
  document.getElementById('taxaAplicada').textContent = taxa.toFixed(2).replace('.', ',') + '%';
}

function nomeBandeiraExibicao(key){
  if (key === 'visa') return 'Visa / Master';
  return RATES[key].name;
}

function montarOrcamento(){
  const bandeiraKey = bandeiraSel.value;
  const valor = Number(valorInput.value) || 0;
  const data = RATES[bandeiraKey];
  const credito = data.credit || {};
  const debito = data.debit || {};

  const parcelas = Object.keys(credito).map(Number).sort((a,b)=>a-b);

  let linhas = [];

  // 1x: usa débito se existir (normalmente mais barato), senão crédito à vista
  if (Object.keys(debito).length) {
    const totalDebito = valor / (1 - debito[1]/100);
    linhas.push(`À vista (Débito)  R$ ${formatBRL(totalDebito).replace('R$','').trim()}`);
  }

  parcelas.forEach(p => {
    const taxa = credito[p];
    const total = valor / (1 - taxa/100);
    const valorParcela = total / p;
    const label = p === 1 ? '1x (à vista)' : `${p}x`;
    if (p === 1) {
      linhas.push(`${label}  R$ ${formatBRL(total).replace('R$','').trim()}`);
    } else {
      linhas.push(`${label} de R$ ${formatBRL(valorParcela).replace('R$','').trim()}  (total R$ ${formatBRL(total).replace('R$','').trim()})`);
    }
  });

  const texto =
`Opções de parcelamento All Imports

Bandeira: ${nomeBandeiraExibicao(bandeiraKey)}
Valor do produto: ${formatBRL(valor)}

${linhas.join('\n')}

All Imports`;

  return texto;
}

const shareBtn = document.getElementById('shareBtn');
const shareBtnLabel = document.getElementById('shareBtnLabel');

async function copiarTexto(texto){
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch (e) {
    // fallback para ambientes sem permissão de clipboard
    try {
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

shareBtn.addEventListener('click', async () => {
  const texto = montarOrcamento();
  const ok = await copiarTexto(texto);

  if (ok) {
    shareBtn.classList.add('copied');
    shareBtnLabel.textContent = 'Copiado! Cole no WhatsApp';
    setTimeout(() => {
      shareBtn.classList.remove('copied');
      shareBtnLabel.textContent = 'Compartilhar Orçamento';
    }, 2200);
  } else {
    shareBtnLabel.textContent = 'Não foi possível copiar';
    setTimeout(() => { shareBtnLabel.textContent = 'Compartilhar Orçamento'; }, 2200);
  }
});

bandeiraSel.addEventListener('change', popularTipos);
tipoSel.addEventListener('change', popularParcelas);
parcelasSel.addEventListener('change', calcular);
valorInput.addEventListener('input', calcular);
toggle.addEventListener('click', () => {
  repassar = !repassar;
  toggle.classList.toggle('on', repassar);
  calcular();
});

popularTipos();
</script>
</body>
